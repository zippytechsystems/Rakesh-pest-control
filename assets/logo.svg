<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Deep Red to Royal Burgundy Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A81B1E"/>
      <stop offset="50%" stop-color="#881416"/>
      <stop offset="100%" stop-color="#580A0C"/>
    </linearGradient>

    <!-- Warm Gold Outline Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Pure White / Platinum Gradient for Capital H -->
    <linearGradient id="hGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="hShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Protective Crest Shield -->
  <path d="M50 4 C74 4 89 13 91 21 C91 58 71 83 50 96 C29 83 9 58 9 21 C11 13 26 4 50 4 Z" 
        fill="url(#shieldGrad)" 
        stroke="#FFFFFF" 
        stroke-width="2.5"/>

  <!-- Inner Gold Inset Boundary -->
  <path d="M50 8.5 C70 8.5 83 16 85 23 C85 54 68 76 50 88 C32 76 15 54 15 23 C17 16 30 8.5 50 8.5 Z" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="1.5" 
        stroke-opacity="0.75"/>

  <!-- Bold Modern Capital 'H' (Harsha) -->
  <g filter="url(#hShadow)">
    <!-- Left Column of H with dynamic beveled cuts -->
    <path d="M28 24 L38 21 V44 H44 V52 H38 V73 L28 70 Z" fill="url(#hGrad)"/>

    <!-- Right Column of H with dynamic beveled cuts -->
    <path d="M62 21 L72 24 V70 L62 73 V52 H56 V44 H62 Z" fill="url(#hGrad)"/>

    <!-- Central Interlocking Bridge of H -->
    <path d="M42 44 H58 V52 H42 Z" fill="url(#hGrad)"/>

    <!-- Center Security Diamond Emblem -->
    <path d="M50 39 L57 48 L50 57 L43 48 Z" fill="#22C55E" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="50" cy="48" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Star of Quality / 20 Years Shield Base -->
  <circle cx="50" cy="80" r="3.5" fill="url(#goldGrad)"/>
  <circle cx="40" cy="78" r="2" fill="url(#goldGrad)" opacity="0.8"/>
  <circle cx="60" cy="78" r="2" fill="url(#goldGrad)" opacity="0.8"/>
</svg>
